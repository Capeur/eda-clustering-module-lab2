title: Métriques d'affinité
footer: learn_clustering — 01 métriques d'affinité
slides:
- type: title
  title: Métriques d'affinité
  subtitle: Quelles parties d'une puce vont ensemble ?
  notes: Quelles parties d'une puce vont ensemble ? C'est la question à laquelle répond
    ce lab. Une puce est faite de millions de minuscules éléments appelés cellules.
    Avant de les placer, un ordinateur doit savoir quelles cellules aiment rester
    proches. Cette attirance est un nombre, qu'on appelle l'affinité. Dans ce lab,
    vous allez découvrir trois façons de la calculer, et voir pourquoi ce choix compte.
- type: two_column
  title: D'une puce à un graphe
  left:
  - Une puce contient des cellules, les petites briques du circuit
  - Les cellules communiquent entre elles par des fils
  - On dessine chaque cellule comme un point, appelé nœud
  - 'Un trait entre deux points est une arête : les deux cellules sont reliées'
  - 'Le nombre sur une arête est son poids : combien de fils relient la paire'
  - 'Ainsi, A–B a un poids de cinq : cinq fils relient A et B'
  right: assets/chip-to-graph.png
  notes: 'Une puce contient des cellules, les petites briques du circuit. Les cellules
    communiquent entre elles par des fils. On dessine chaque cellule comme un point,
    appelé nœud. Un trait entre deux points est une arête : les deux cellules sont
    reliées. Le nombre sur une arête est son poids : combien de fils relient la paire.
    Ainsi, A–B a un poids de cinq : cinq fils relient A et B. Ce dessin s''appelle
    un graphe, et c''est la carte sur laquelle travaillent tous les algorithmes de
    ce cours.'
- type: two_column
  title: Pourquoi regrouper les cellules ?
  left:
  - Les cellules qui échangent beaucoup de signaux doivent être proches
  - Des fils courts rendent la puce plus rapide et économisent de l'énergie
  - Regrouper les cellules proches s'appelle le clustering, et chaque groupe est un
    cluster
  - 'Pensez à un plan de classe : les amis qui discutent beaucoup s''assoient ensemble'
  - Ici, A, B et C forment un groupe, et D et E en forment un autre
  - Seules les arêtes rouges passent d'un groupe à l'autre, et on en veut le moins
    possible
  right: assets/clustering-groups.png
  notes: 'Les cellules qui échangent beaucoup de signaux doivent être proches. Des
    fils courts rendent la puce plus rapide et économisent de l''énergie. Regrouper
    les cellules proches s''appelle le clustering, et chaque groupe est un cluster.
    Pensez à un plan de classe : les amis qui discutent beaucoup s''assoient ensemble.
    Ici, A, B et C forment un groupe, et D et E en forment un autre. Seules les arêtes
    rouges passent d''un groupe à l''autre, et on en veut le moins possible.'
- type: bullets
  title: Qu'est-ce que l'affinité ?
  bullets:
  - L'affinité est un score donné à chaque paire de cellules
  - Un score élevé veut dire que ces deux-là doivent être dans le même groupe
  - Un score faible veut dire qu'elles peuvent être séparées
  - Les algorithmes de clustering fusionnent d'abord la paire qui a le meilleur score
  - La recette du score décide donc de tout ce qui suit
  - Ce lab compare trois recettes sur le même petit exemple
  notes: L'affinité est un score donné à chaque paire de cellules. Un score élevé
    veut dire que ces deux-là doivent être dans le même groupe. Un score faible veut
    dire qu'elles peuvent être séparées. Les algorithmes de clustering fusionnent
    d'abord la paire qui a le meilleur score. La recette du score décide donc de tout
    ce qui suit. Ce lab compare trois recettes sur le même petit exemple.
- type: image
  title: Un petit graphe pondéré
  image: assets/steps/01-raw-graph.png
  caption: Un petit graphe pondéré
  notes: 'Voici notre exemple pour tout le lab : cinq cellules, de A à E. Les arêtes
    lourdes sont A–B et D–E, avec un poids de cinq chacune. C est au milieu, avec
    des liens plus fins vers les autres. Gardez cette image en tête : nous allons
    donner un score à chaque paire de cellules de ce graphe.'
- type: image
  title: L'affinité par poids d'arête classe les paires
  image: assets/steps/02-edge-rank.png
  caption: L'affinité par poids d'arête classe les paires
  notes: 'La première recette est la plus simple. Le score d''une paire est simplement
    le poids de l''arête qui les relie. Ensuite, on trie les paires du plus grand
    au plus petit score, comme un classement sportif. A–B et D–E sont à égalité, à
    cinq. Quand deux scores sont égaux, on les départage par ordre alphabétique :
    A–B passe donc en premier. Ce départage fixe est important : il garantit que l''ordinateur
    donne toujours la même réponse.'
- type: image
  title: Les voisins communs renforcent A–B
  image: assets/steps/03-shared-idea.png
  caption: Les voisins communs renforcent A–B
  notes: 'La deuxième recette ajoute une idée de la vie de tous les jours : les amis
    de nos amis. Si deux personnes ont un ami proche en commun, elles sont sans doute
    proches aussi. A et B sont reliés directement, avec un poids de cinq. Ils ont
    aussi un voisin en commun : C. On ajoute le plus faible des deux liens qui passent
    par C, c''est-à-dire un, donc A–B monte à six. Pourquoi le plus faible ? Parce
    qu''une chaîne n''est jamais plus solide que son maillon le plus faible.'
- type: image
  title: Le classement par voisins communs rebat les cartes
  image: assets/steps/04-shared-rank.png
  caption: Le classement par voisins communs rebat les cartes
  notes: 'Avec la deuxième recette, A–B et D–E restent en tête, maintenant à six.
    Mais regardez A–C : seule, c''était une arête faible de poids un, et maintenant
    elle bondit à cinq, grâce à B. Même des paires sans aucune arête, comme B–D, obtiennent
    un score, parce qu''elles ont un voisin en commun.'
- type: image
  title: Pourquoi l'affinité compte en EDA
  image: assets/steps/05-takeaway.png
  caption: Pourquoi l'affinité compte en EDA
  notes: 'EDA signifie conception électronique automatisée : ce sont les logiciels
    qui conçoivent les puces. En EDA, l''affinité est la préférence locale : quelles
    cellules vont ensemble, avant toute règle sur la puce entière. Une mauvaise affinité
    donne de mauvaises fusions, et les corriger ensuite est bien plus difficile.'
- type: two_column
  title: 'Exemple résolu : le score de A–C'
  left:
  - Calculons un score ensemble, étape par étape
  - 'Étape un : l''arête directe A–C a un poids de un'
  - 'Étape deux : A et C ont un voisin en commun, B'
  - 'Les liens qui passent par B pèsent cinq et quatre, on garde le plus petit : quatre'
  - 'Étape trois : on additionne, un plus quatre font cinq'
  - Seule, A–C était faible, mais elle devient forte grâce à son ami commun
  right: assets/worked-ac.png
  notes: 'Calculons un score ensemble, étape par étape. Étape un : l''arête directe
    A–C a un poids de un. Étape deux : A et C ont un voisin en commun, B. Les liens
    qui passent par B pèsent cinq et quatre, on garde le plus petit : quatre. Étape
    trois : on additionne, un plus quatre font cinq. Seule, A–C était faible, mais
    elle devient forte grâce à son ami commun.'
- type: bullets
  title: Dix paires, pas six
  bullets:
  - Avec la deuxième recette, notre petit graphe donne dix paires au lieu de six
  - Quatre d'entre elles n'ont aucun fil entre elles
  - Par exemple, B et D ne sont pas reliés, mais tous les deux sont reliés à C
  - 'B–D obtient donc le plus faible de ces deux liens : deux'
  - C'est comme deux personnes qui ne se sont jamais vues mais ont le même meilleur
    ami
  - Seules les paires dont le score vaudrait zéro sont exclues
  notes: 'Avec la deuxième recette, notre petit graphe donne dix paires au lieu de
    six. Quatre d''entre elles n''ont aucun fil entre elles. Par exemple, B et D ne
    sont pas reliés, mais tous les deux sont reliés à C. B–D obtient donc le plus
    faible de ces deux liens : deux. C''est comme deux personnes qui ne se sont jamais
    vues mais ont le même meilleur ami. Seules les paires dont le score vaudrait zéro
    sont exclues.'
- type: bullets
  title: La deuxième recette en pseudo-code
  bullets:
  - Voici la deuxième recette écrite sous forme d'étapes qu'un ordinateur peut suivre
  - D'abord, chaque arête ajoute son poids à sa propre paire
  - Ensuite, pour chaque paire de nœuds, on regarde chaque voisin qu'ils ont en commun
  - Pour chaque voisin commun, on ajoute le plus petit de ses deux liens
  - On garde chaque paire dont le score finit au-dessus de zéro
  - Enfin, on trie par score décroissant et on départage les égalités par ordre alphabétique
  notes: Voici la deuxième recette écrite sous forme d'étapes qu'un ordinateur peut
    suivre. D'abord, chaque arête ajoute son poids à sa propre paire. Ensuite, pour
    chaque paire de nœuds, on regarde chaque voisin qu'ils ont en commun. Pour chaque
    voisin commun, on ajoute le plus petit de ses deux liens. On garde chaque paire
    dont le score finit au-dessus de zéro. Enfin, on trie par score décroissant et
    on départage les égalités par ordre alphabétique.
- type: code
  title: La deuxième recette en pseudo-code — à essayer
  code: "affinity_shared_neighbors(nodes, edges):\n  score[u,v] = w(u,v) pour chaque\
    \ arête\n  pour chaque paire (u, v) de nœuds :\n    s = 0\n    pour x dans voisins(u),\
    \ x != v :\n      si x dans voisins(v) :\n        s += min(w(u,x), w(v,x))\n \
    \   si s > 0 ou (u,v) a une arête :\n      score[u,v] += s\n  trier par score\
    \ (décroissant), puis u, puis v"
  notes: ''
- type: two_column
  title: Même graphe, première fusion différente
  left:
  - Voici un deuxième exemple qui montre pourquoi la recette compte
  - Prenons un triangle serré P, Q, R, dont chaque arête pèse quatre
  - À côté, une paire isolée X–Y a un poids de cinq
  - La première recette choisit X–Y, car cinq bat quatre
  - 'La deuxième donne à P–Q quatre, plus quatre via R : huit'
  - P–Q passe donc en premier
  right: assets/priority-graph.png
  notes: 'Voici un deuxième exemple qui montre pourquoi la recette compte. Prenons
    un triangle serré P, Q, R, dont chaque arête pèse quatre. À côté, une paire isolée
    X–Y a un poids de cinq. La première recette choisit X–Y, car cinq bat quatre.
    La deuxième donne à P–Q quatre, plus quatre via R : huit. P–Q passe donc en premier.
    Même graphe, même règle de fusion, mais une première fusion différente.'
- type: two_column
  title: Des nets à nombreuses broches
  left:
  - Sur une vraie puce, un même fil peut relier plusieurs cellules à la fois
  - Un tel fil partagé s'appelle un net, et chaque cellule qu'il touche est une broche
  - 'Pensez à une discussion de groupe à cinquante : elle en dit peu sur qui est ami
    avec qui'
  - Un message privé entre deux personnes en dit beaucoup plus
  - 'La troisième recette fonctionne pareil : chaque net partage son poids entre ses
    broches'
  - 'La règle : le poids divisé par le nombre de broches moins un'
  right: assets/wide-nets.png
  notes: 'Sur une vraie puce, un même fil peut relier plusieurs cellules à la fois.
    Un tel fil partagé s''appelle un net, et chaque cellule qu''il touche est une
    broche. Pensez à une discussion de groupe à cinquante : elle en dit peu sur qui
    est ami avec qui. Un message privé entre deux personnes en dit beaucoup plus.
    La troisième recette fonctionne pareil : chaque net partage son poids entre ses
    broches. La règle : le poids divisé par le nombre de broches moins un. Ici, les
    nets enable et reset touchent cinq cellules chacun, ils ne donnent donc qu''un
    quart à chaque paire. Le net privé entre E et F donne tout son poids, c''est-à-dire
    un.'
- type: code
  title: Des nets à nombreuses broches — à essayer
  code: "petite netlist : en {A,B,C,D,E}, rst {A,B,C,D,E}, n1 {E,F}\n\n          \
    \ nombre brut de nets    nombre de broches w/(|e|-1)\nA-B        1 + 1 = 2   \
    \           1/4 + 1/4 = 0.5\nE-F        1                      1/1 = 1.0\n1re\
    \ fusion A-B                    E-F"
  notes: ''
- type: image
  title: Le parcours lab dans le navigateur
  image: assets/lab-starter.png
  caption: Le lab dans le navigateur
  notes: À vous maintenant de calculer des scores, dans le lab du navigateur. Cliquez
    sur deux nœuds pour choisir une paire, même une paire sans arête, calculez son
    score à la main, puis saisissez-le. Le lab vous dit tout de suite si c'est juste.
    Vous pouvez aussi construire votre propre classement, une paire à la fois, et
    modifier les poids des arêtes pour voir quelle paire fusionne en premier. Les
    dix défis vont du plus facile au plus difficile. Si vous bloquez, le bouton de
    détail montre le calcul, mais cette réponse ne compte plus pour le défi.
- type: image
  title: Le parcours implémentation
  image: assets/real-shell.png
  caption: Session dans un vrai terminal
  notes: 'Si vous aimez programmer, le parcours implémentation est fait pour vous.
    D''abord, affichez les deux classements avec le programme de référence, pour le
    graphe de départ puis pour le graphe de priorité. Ensuite, écrivez vos trois fonctions
    de score en Python. Enfin, lancez le vérificateur sur votre fichier. Il compare
    vos réponses aux bonnes, et il fournit les arêtes dans le désordre : un départage
    oublié apparaît donc comme un échec.'
- type: code
  title: Le parcours implémentation — à essayer
  code: '# indiquer à Python où sont les fonctions partagées

    export PYTHONPATH=../common


    # les deux classements : graphe de départ, puis graphe de priorité

    python3 ../common/solvers.py examples/tiny_graph.json --mode affinity

    python3 ../common/solvers.py examples/priority_graph.json --mode affinity


    # vérifier tous les résultats de référence sur vos propres fonctions

    python3 examples/affinity_check.py --impl my_affinity.py'
  notes: ''
- type: bullets
  title: Les pièges à éviter
  bullets:
  - Attention à quatre erreurs fréquentes
  - Compter deux fois une arête, une fois depuis chaque extrémité
  - 'Ajouter le lien le plus fort au lieu du plus faible : tout semble alors proche
    de tout'
  - 'Oublier le départage : A–B et D–E changent de place d''une exécution à l''autre'
  - Et compter les grands nets partagés à plein poids, ce qui colle des cellules sans
    rapport
  notes: 'Attention à quatre erreurs fréquentes. Compter deux fois une arête, une
    fois depuis chaque extrémité. Ajouter le lien le plus fort au lieu du plus faible
    : tout semble alors proche de tout. Oublier le départage : A–B et D–E changent
    de place d''une exécution à l''autre. Et compter les grands nets partagés à plein
    poids, ce qui colle des cellules sans rapport.'
- type: bullets
  title: 'Récapitulatif : trois recettes'
  bullets:
  - 'Recette un, le poids d''arête : on ne regarde que le fil direct'
  - 'Recette deux, les voisins communs : on ajoute l''aide des amis communs'
  - 'Recette trois, le nombre de broches : un grand net partagé compte moins qu''un
    net privé'
  - Les égalités se départagent par ordre alphabétique, donc les résultats ne changent
    jamais
  - Des recettes différentes peuvent choisir une première fusion différente
  - Choisir la recette est une décision de conception, pas un détail
  notes: 'Recette un, le poids d''arête : on ne regarde que le fil direct. Recette
    deux, les voisins communs : on ajoute l''aide des amis communs. Recette trois,
    le nombre de broches : un grand net partagé compte moins qu''un net privé. Les
    égalités se départagent par ordre alphabétique, donc les résultats ne changent
    jamais. Des recettes différentes peuvent choisir une première fusion différente.
    Choisir la recette est une décision de conception, pas un détail.'
- type: bullets
  title: À vous de jouer
  bullets:
  - Essayez les défis du lab, ou écrivez les trois recettes et passez le vérificateur
  - Puis expliquez deux choses avec vos propres mots
  - D'abord, pourquoi A–C monte-t-elle avec la deuxième recette ?
  - Ensuite, pourquoi le graphe de priorité change-t-il sa première fusion ?
  - Faites le petit quiz, puis passez à la fusion gloutonne par paires
  - Là, ces scores deviennent la règle de fusion
  notes: Essayez les défis du lab, ou écrivez les trois recettes et passez le vérificateur.
    Puis expliquez deux choses avec vos propres mots. D'abord, pourquoi A–C monte-t-elle
    avec la deuxième recette ? Ensuite, pourquoi le graphe de priorité change-t-il
    sa première fusion ? Faites le petit quiz, puis passez à la fusion gloutonne par
    paires. Là, ces scores deviennent la règle de fusion.
